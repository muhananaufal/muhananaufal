<svg width="820" height="170" viewBox="0 0 820 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metricsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <clipPath id="barClip">
      <rect x="20" y="52" width="780" height="14" rx="7" />
    </clipPath>
  </defs>
  <style>
    @keyframes slide-in-bar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @keyframes fade-in-legend {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .title { font: 700 18px 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #ffffff; }
    .langName { font: 600 14px 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #c9d1d9; }
    .langPct { font: 400 14px 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #8b949e; }
    
    .bar-grow { transform-origin: left; animation: slide-in-bar 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .legend-fade { animation: fade-in-legend 0.8s ease-out both; }
  </style>
  <rect x="1" y="1" width="818" height="168" rx="12" fill="url(#metricsBg)" stroke="#30363d" stroke-width="1.5" />
  
  <text x="22" y="34" class="title">⚡ Real-Time Codebase and Language Distribution</text>
  
  <g clip-path="url(#barClip)">
    <rect x="20" y="52" width="780" height="14" fill="#21262d" />
    <rect x="20" y="52" width="402.3407507782621" height="14" fill="#4F5D95" class="bar-grow" style="animation-delay: 0s;" />
<rect x="422.3407507782621" y="52" width="144.15445187892774" height="14" fill="#f1e05a" class="bar-grow" style="animation-delay: 0.1s;" />
<rect x="566.4952026571898" y="52" width="48.28552152700823" height="14" fill="#dea584" class="bar-grow" style="animation-delay: 0.2s;" />
<rect x="614.780724184198" y="52" width="36.61949548643661" height="14" fill="#012456" class="bar-grow" style="animation-delay: 0.30000000000000004s;" />
<rect x="651.4002196706346" y="52" width="34.54158434168449" height="14" fill="#00ADD8" class="bar-grow" style="animation-delay: 0.4s;" />
<rect x="685.941804012319" y="52" width="27.379569309580546" height="14" fill="#f7523f" class="bar-grow" style="animation-delay: 0.5s;" />

  </g>
  
  <g>
    
      <circle cx="25" cy="95" r="4" fill="#4F5D95" class="legend-fade" style="animation-delay: 0.5s;" />
      <text x="35" y="100" class="langName legend-fade" style="animation-delay: 0.5s;">PHP</text>
      <text x="120" y="100" class="langPct legend-fade" style="animation-delay: 0.5s;">51.6%</text>
    
      <circle cx="220" cy="95" r="4" fill="#f1e05a" class="legend-fade" style="animation-delay: 0.6s;" />
      <text x="230" y="100" class="langName legend-fade" style="animation-delay: 0.6s;">JavaScript</text>
      <text x="315" y="100" class="langPct legend-fade" style="animation-delay: 0.6s;">18.5%</text>
    
